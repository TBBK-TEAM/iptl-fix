name: Build

# Manual only: run it from the Actions tab ("Run workflow").
#
# The jar is uploaded as a *non-archived* artifact (upload-artifact v7, `archive: false`),
# so downloading the artifact gives you the plain .jar instead of a .zip.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Verify jar contents
        run: |
          JAR=$(ls build/libs/*.jar | head -n1)
          ls -l "$JAR"
          unzip -l "$JAR"
          unzip -l "$JAR" | grep -q 'iptlfix.mixins.json'                       || { echo "::error::iptlfix.mixins.json missing from the jar"; exit 1; }
          unzip -l "$JAR" | grep -q 'META-INF/neoforge.mods.toml'               || { echo "::error::neoforge.mods.toml missing from the jar"; exit 1; }
          unzip -l "$JAR" | grep -q 'MixinServerCommonPacketListenerImpl.class' || { echo "::error::mixin class missing from the jar"; exit 1; }

      - name: Upload jar (not zipped)
        uses: actions/upload-artifact@v7
        with:
          name: iptl-respawn-fix-jar
          path: build/libs/*.jar
          archive: false
          if-no-files-found: error
