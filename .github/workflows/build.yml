name: Build

# Manual only: run it from the Actions tab ("Run workflow").
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Show jar contents
        run: |
          ls -l build/libs
          unzip -l build/libs/*.jar

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: iptl-respawn-fix-jar
          path: build/libs/*.jar
          if-no-files-found: error
