name: Build

# Manual only: run it from the Actions tab ("Run workflow").
#
# The jar is published as a GitHub Release asset, i.e. a raw .jar download.
# (Workflow artifacts are always delivered as .zip by GitHub, so a Release is used
# instead when you want the plain jar.)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build and publish jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Verify jar
        run: |
          ls -l build/libs
          JAR=$(ls build/libs/*.jar | head -n1)
          unzip -l "$JAR"
          unzip -l "$JAR" | grep -q 'iptlfix.mixins.json'            || { echo "::error::iptlfix.mixins.json missing from the jar"; exit 1; }
          unzip -l "$JAR" | grep -q 'META-INF/neoforge.mods.toml'    || { echo "::error::neoforge.mods.toml missing from the jar"; exit 1; }
          unzip -l "$JAR" | grep -q 'MixinServerCommonPacketListenerImpl.class' || { echo "::error::mixin class missing from the jar"; exit 1; }

      - name: Publish raw jar to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          JAR=$(ls build/libs/*.jar | head -n1)
          echo "publishing $JAR as release asset of $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --title "$TAG" --generate-notes
          fi
